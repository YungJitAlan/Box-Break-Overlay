<div>
  <h1 id="pack"></h1>
  <h2 id="last_hit"></h2>
  <h3 id="remaining"></h3>
  <div id="teams"></div>
  <div id="big_hit" style="display:none;">🔥 BIG HIT 🔥</div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const socket = io();

function renderTeams(teams){
    const container = document.getElementById('teams');
    container.innerHTML = "";

    for(const team in teams){
        const t = teams[team];

        const div = document.createElement("div");
        div.innerText = t.sold ? `${team} - ${t.buyer}` : team;
        div.style.color = t.sold ? "lime" : "white";

        container.appendChild(div);
    }
}

socket.on('update', payload => {
    renderTeams(payload.teams);

    document.getElementById('pack').innerText = "Pack: " + payload.data.pack;
    document.getElementById('last_hit').innerText = "Last Hit: " + payload.data.last_hit;
    document.getElementById('remaining').innerText = "Remaining: " + payload.remaining;

    if(payload.data.big_hit){
        const bh = document.getElementById('big_hit');
        bh.style.display = "block";

        confetti({ particleCount: 150, spread: 100 });

        setTimeout(() => bh.style.display = "none", 3000);
    }
});
</script>
