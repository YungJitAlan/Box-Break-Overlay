<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="overlay">
  <h1>{{ data.title }}</h1>
  <p>Pack: {{ data.pack }}</p>
  <p>Buyer: {{ data.current_buyer }}</p>
  <p>Last Hit: {{ data.last_hit }}</p>

  {% if data.big_hit %}
  <div id="big-hit">🔥 BIG HIT! 🔥</div>
  <script src="/static/confetti.js"></script>
  {% endif %}
</div>

<!-- Auto-refresh every 2 seconds -->
<meta http-equiv="refresh" content="2">
</body>
</html>
